<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prioritize CommitMonoGyratina as the system default monospace font -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CommitMonoGyratina</family>
    </prefer>
  </alias>
</fontconfig>
